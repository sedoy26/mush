[package]
name = "mush-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mush_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.7"
cpal = "0.17.3"
hound = "3.5.1"
midir = "0.11.0"
parking_lot = "0.12.5"
rand = { version = "0.8", features = ["small_rng"] }
rtrb = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

