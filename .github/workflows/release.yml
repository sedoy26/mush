# Build precompiled mush-cli binaries and attach them to a GitHub Release when you push a version tag (e.g. v0.0.1).
# The tag may point at any branch (e.g. refactoring/rust before merge); checkout uses the tagged commit.
# Requires: default GITHUB_TOKEN with contents: write (enabled for Actions in repo Settings).

name: Release

on:
  push:
    tags:
      # Match semver-style tags (GitHub examples use v*.*.*); keep v* for short tags like v1
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mush-cli
            artifact_name: mush-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mush-cli.exe
            artifact_name: mush-cli-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: mush-cli
            artifact_name: mush-cli-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: mush-cli
            artifact_name: mush-cli-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo build
        working-directory: rust
        run: cargo build -p mush-cli --release --target ${{ matrix.target }}

      - name: Strip (Unix)
        if: runner.os != 'Windows'
        working-directory: rust
        run: strip target/${{ matrix.target }}/release/${{ matrix.bin }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded artifacts
        run: find dist -type f -ls

      # Flatten upload-artifact layout (dist/<artifact-name>/<binary>) so gh-release gets simple globs.
      - name: Stage release binaries
        run: |
          set -euo pipefail
          mkdir -p assets
          shopt -s nullglob
          for dir in dist/*/; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            for f in "$dir"*; do
              [[ -f "$f" ]] || continue
              cp -v "$f" "assets/$name"
            done
          done
          nfiles="$(find assets -type f | wc -l | tr -d '[:space:]')"
          test "$nfiles" -eq 4
          ls -la assets/

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Pre-built **mush-cli** — no Rust toolchain needed. Pick the asset for your OS from the table in the repo README (**Install (binary, no Rust)**). Run the binary from the **repository root** next to `projects/` and `wav/`. Working audio output is required; **ffmpeg** on `PATH` is optional (camera mode only).
          files: assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
